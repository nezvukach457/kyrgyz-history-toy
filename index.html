<!doctype html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кыргыз тарыхы</title>
<style>
body{margin:0;background:linear-gradient(145deg,#07111f,#172d4b);color:#fff;font-family:Arial,sans-serif}.wrap{max-width:700px;margin:auto;padding:18px}.card{background:#102038;border:1px solid #29415f;border-radius:22px;padding:20px;margin:12px 0;box-shadow:0 15px 40px #0005}h1{text-align:center}input,button{width:100%;padding:15px;margin:7px 0;border-radius:13px;font-size:17px}input{box-sizing:border-box;background:#091525;color:#fff;border:1px solid #38506e}button{border:0;background:#f5bd45;font-weight:bold}.opt{text-align:left;background:#0a1729;color:#fff;border:1px solid #38506e}.hidden{display:none}.room{color:#ffd45f;font-size:30px;font-weight:bold;text-align:center}.q{font-size:23px;font-weight:bold;line-height:1.35}.muted{color:#a9bad0;text-align:center}.rank{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #29415f}.win{text-align:center;font-size:30px;color:#ffd45f}
</style></head><body><div class="wrap"><h1>🇰🇬 Кыргызстандын тарыхы</h1>
<div id="join" class="card"><h2>Оюнга кошулуу</h2><input id="name" placeholder="Атыңыз"><input id="room" placeholder="Бөлмө коду"><button id="joinBtn">Кирүү</button><p id="msg" class="muted"></p></div>
<div id="wait" class="card hidden"><div class="room" id="rb"></div><h2 id="hello"></h2><p class="muted">Алып баруучу оюнду башташын күтүңүз…</p></div>
<div id="game" class="card hidden"><p id="num"></p><div id="qq" class="q"></div><div id="opts"></div><p id="am" class="muted"></p></div>
<div id="done" class="card hidden"><div class="win">🏆 Оюн бүттү!</div><h2 id="me"></h2><p id="mys"></p><h3>Жыйынтык рейтинг</h3><div id="final"></div></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getDatabase,ref,set,get,update,onValue}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
const firebaseConfig={apiKey:"PASTE_API_KEY",authDomain:"kyrgyz-history-toy.firebaseapp.com",databaseURL:"https://kyrgyz-history-toy-default-rtdb.firebaseio.com",projectId:"kyrgyz-history-toy",storageBucket:"kyrgyz-history-toy.firebasestorage.app",messagingSenderId:"PASTE_MESSAGING_SENDER_ID",appId:"PASTE_APP_ID"};
const app=initializeApp(firebaseConfig),db=getDatabase(app);
const questions=[[("Кыргыз каганаты кайсы кылымдарда күчтүү мамлекет болгон?", ["VI–VIII кылымдар", "XIII–XV кылымдар", "XVIII–XIX кылымдар", "XX–XXI кылымдар"], 0)],[("Енисей кыргыздары кайсы аймак менен байланыштуу?", ["Енисей өрөөнү", "Нил өрөөнү", "Амазонка", "Балкан"], 0)],[("«Манас» эпосунун башкы каарманы ким?", ["Манас", "Чыңгыз хан", "Курманбек", "Ормон хан"], 0)],[("Баласагын шаары кайсы мамлекеттин борборлорунун бири болгон?", ["Караханийлер каганаты", "Рим империясы", "Осмон империясы", "Франция"], 0)],[("Жусуп Баласагындын белгилүү чыгармасы?", ["Кутадгу билиг", "Манас", "Бабурнаме", "Кодекс Куманикус"], 0)],[("Махмуд Кашгаринин белгилүү эмгеги?", ["Дивану лугат ат-түрк", "Кутадгу билиг", "Манас", "Жами ат-таварих"], 0)],[("Кокон хандыгынын таасири кыргыз жерине XIX кылымда тараганбы?", ["Ооба", "Жок", "Тек XX кылымда", "Белгисиз"], 0)],[("1916-жылдагы чоң тарыхый окуя кандай аталат?", ["Үркүн", "Кайра куруу", "Апрель окуясы", "Улуу Жибек жолу"], 0)],[("Кыргыз АССРи кайсы жылы түзүлгөн?", ["1926", "1916", "1945", "1991"], 0)],[("Кыргыз ССРи кайсы мезгилде болгон?", ["1936–1991", "1916–1920", "1991–2000", "1800–1850"], 0)],[("Кыргызстан эгемендүүлүгүн кайсы жылы жарыялаган?", ["1991", "1985", "2001", "1926"], 0)],[("Эгемендүүлүк күнү кайсы датада?", ["31-август", "5-май", "7-ноябрь", "1-декабрь"], 0)],[("Биринчи Конституция эгемендүүлүк мезгилинде кайсы жылы кабыл алынган?", ["1993", "1991", "2005", "2010"], 0)],[("Кыргызстандын желегиндеги түндүктүн шакек саны?", ["40", "10", "50", "100"], 0)],[("Чыңгыз Айтматов дүйнөгө кайсы тармакта таанылган?", ["Адабиятта", "Физикада", "Авиацияда", "Архитектурада"], 0)],[("«Манас» кайсы элдин дүйнөлүк маданий мурасы?", ["Кыргыз элинин", "Жапон элинин", "Француз элинин", "Мисир элинин"], 0)],[("Кыргызстандын байыркы тарыхын изилдөөдөгү маанилүү булактардын бири?", ["Кытай жылнаамалары", "Телевидение", "Интернет блогдор", "Газета"], 0)],[("Кыргызстандын Россия империясына кошулушу негизинен кайсы кылымда күчөгөн?", ["XIX кылымда", "XVI кылымда", "XXI кылымда", "XIII кылымда"], 0)],[("Кыргыз Республикасынын мамлекеттик гимнинин авторлорунун бири?", ["Жамил Садыков", "Алыкул Осмонов", "Чыңгыз Айтматов", "Токтогул Сатылганов"], 0)],[("Кыргызстандын тарыхында Улуу Жибек жолу маанилүү болгонбу?", ["Ооба", "Жок", "Тек деңиз жолу болгон", "Белгисиз"], 0)]];
let room="",id="",answered=false;
const $=x=>document.getElementById(x);const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function show(x){["join","wait","game","done"].forEach(y=>$(y).classList.toggle("hidden",x!=y))}
function rank(p){return Object.values(p||{}).sort((a,b)=>(b.score||0)-(a.score||0))}
$("room").value=new URLSearchParams(location.search).get("room")||"";
$("joinBtn").onclick=async()=>{let name=$("name").value.trim(),r=$("room").value.trim().toUpperCase();if(!name||!r){$("msg").textContent="Атыңызды жана кодду жазыңыз.";return}let s=await get(ref(db,"rooms/"+r));if(!s.exists()){$("msg").textContent="Бөлмө табылган жок.";return}room=r;id=Math.random().toString(36).slice(2,10);await set(ref(db,`rooms/${room}/players/${id}`),{name,score:0,answered:{}});$("rb").textContent=room;$("hello").textContent="Салам, "+name+"!";show("wait");listen()};
function listen(){onValue(ref(db,"rooms/"+room),s=>{let d=s.val();if(!d)return;if(d.status=="question"){show("game");draw(d)}else if(d.status=="finished"){show("done");let p=d.players?.[id];$("me").textContent=p?.name||"";$("mys").textContent="Упай: "+(p?.score||0);$("final").innerHTML=rank(d.players).map((x,i)=>`<div class=rank>${i+1}. ${esc(x.name)}<b>${x.score||0}</b></div>`).join("")}else show("wait")})}
function draw(d){let i=+d.current,q=questions[i];$("num").textContent=`${i+1} / ${questions.length}`;$("qq").textContent=q[0];$("am").textContent="";answered=d.players?.[id]?.answered?.[i]!==undefined;$("opts").innerHTML=q[1].map((x,j)=>`<button class=opt ${answered?"disabled":""} data-i="${j}">${String.fromCharCode(65+j)}. ${esc(x)}</button>`).join("");document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i))}
async function answer(choice){if(answered)return;let s=await get(ref(db,"rooms/"+room)),d=s.val(),i=+d.current;if(Date.now()>+d.deadline){$("am").textContent="Убакыт бүттү.";return}answered=true;let old=d.players[id].score||0,add=choice==questions[i][2]?1:0;let obj={score:old+add};obj[`answered/${i}`]=choice;await update(ref(db,`rooms/${room}/players/${id}`),obj);$("am").textContent=add?"Туура! +1":"Туура эмес."}
</script></body></html>
